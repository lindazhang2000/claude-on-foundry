<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5FAFF"/>
      <stop offset="45%" stop-color="#F3F0FB"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="trackA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1976D2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1976D2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="trackB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5E35B1" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5E35B1" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="foundry" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#16A34A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Foundry convergence glow (right side) -->
  <circle cx="1080" cy="360" r="320" fill="url(#foundry)"/>

  <!-- Two paths converging into Foundry -->
  <g fill="none" stroke-linecap="round" filter="url(#soft)">
    <!-- Track A (top, blue) -->
    <path d="M -50 210 C 350 210, 620 250, 1040 350" stroke="url(#trackA)" stroke-width="10"/>
    <path d="M -50 250 C 350 250, 620 290, 1040 360" stroke="url(#trackA)" stroke-width="4" opacity="0.5"/>
    <!-- Track B (bottom, purple) -->
    <path d="M -50 520 C 350 520, 620 470, 1040 370" stroke="url(#trackB)" stroke-width="10"/>
    <path d="M -50 560 C 350 560, 620 510, 1040 380" stroke="url(#trackB)" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- Foundry node -->
  <circle cx="1060" cy="360" r="46" fill="#16A34A" opacity="0.18"/>
  <circle cx="1060" cy="360" r="26" fill="#16A34A" opacity="0.30"/>

  <!-- Track endpoint dots -->
  <circle cx="60" cy="230" r="9" fill="#1976D2" opacity="0.7"/>
  <circle cx="60" cy="540" r="9" fill="#5E35B1" opacity="0.7"/>

  <!-- Subtle top/bottom accent bars -->
  <rect x="0" y="0" width="1280" height="6" fill="#1565C0" opacity="0.85"/>
  <rect x="0" y="714" width="1280" height="6" fill="#16A34A" opacity="0.85"/>
</svg>
