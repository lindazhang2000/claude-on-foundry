<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 472" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Claude Code routing to Microsoft Foundry, with Claude model deployments inside the Foundry resource">
  <defs>
    <!-- Azure logo gradients -->
    <linearGradient id="azA" x1="60.919" y1="9.602" x2="32.99" y2="92.137" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#114A8B"/>
      <stop offset="1" stop-color="#0669BC"/>
    </linearGradient>
    <linearGradient id="azB" x1="69.677" y1="53.612" x2="63.219" y2="55.797" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-opacity=".3"/>
      <stop offset=".071" stop-opacity=".2"/>
      <stop offset=".321" stop-opacity=".1"/>
      <stop offset=".623" stop-opacity=".05"/>
      <stop offset="1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="azC" x1="66.124" y1="7.207" x2="96.781" y2="88.93" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3CCBF4"/>
      <stop offset="1" stop-color="#2892DF"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ===== Containers ===== -->
  <rect x="30" y="64" width="270" height="360" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="360" y="64" width="670" height="360" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- Container titles -->
  <text x="165" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Developer machine</text>
  <text x="695" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#3B0764">Microsoft Foundry resource</text>

  <!-- ===== Developer machine nodes ===== -->
  <rect x="48" y="92" width="112" height="62" rx="9" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="104" y="117" text-anchor="middle" font-size="12.5" fill="#0D47A1">VS Code +</text>
  <text x="104" y="134" text-anchor="middle" font-size="12.5" fill="#0D47A1">Claude Code</text>

  <rect x="172" y="92" width="110" height="62" rx="9" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="227" y="127" text-anchor="middle" font-size="12.5" fill="#0D47A1">claude CLI</text>

  <rect x="48" y="192" width="234" height="86" rx="9" fill="#FFD43B" stroke="#B8860B" stroke-width="2.5"/>
  <text x="165" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">Env vars</text>
  <text x="165" y="236" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#1A1A1A">CLAUDE_CODE_USE_FOUNDRY=1</text>
  <text x="165" y="255" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#1A1A1A">ANTHROPIC_FOUNDRY_RESOURCE</text>

  <rect x="48" y="312" width="234" height="66" rx="9" fill="#FFD43B" stroke="#B8860B" stroke-width="2.5"/>
  <text x="165" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">az login session</text>
  <text x="165" y="359" text-anchor="middle" font-size="11.5" fill="#1A1A1A">(Entra ID bearer)</text>

  <!-- internal dev arrows -->
  <path d="M104 154 L130 192" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M227 154 L200 192" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M165 278 L165 312" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Microsoft Foundry nodes ===== -->
  <!-- Azure logo (official mark) -->
  <g transform="translate(372,80) scale(0.46)">
    <path d="M33.338 6.544h26.038l-27.03 80.087a4.152 4.152 0 0 1-3.933 2.824H8.149a4.145 4.145 0 0 1-3.928-5.47L29.404 9.368a4.152 4.152 0 0 1 3.934-2.824z" fill="url(#azA)"/>
    <path d="M71.175 60.261h-41.29a1.911 1.911 0 0 0-1.305 3.309l26.532 24.764a4.171 4.171 0 0 0 2.846 1.121h23.38z" fill="#0078D4"/>
    <path d="M33.338 6.544a4.118 4.118 0 0 0-3.943 2.879L4.252 83.917a4.14 4.14 0 0 0 3.908 5.538h20.787a4.443 4.443 0 0 0 3.41-2.9l5.014-14.777 17.91 16.705a4.237 4.237 0 0 0 2.666.972h23.292L71.121 60.261H45.7l15.552-45.346z" fill="url(#azB)"/>
    <path d="M66.595 9.366a4.145 4.145 0 0 0-3.928-2.822H33.648a4.146 4.146 0 0 1 3.928 2.822l25.184 74.62a4.146 4.146 0 0 1-3.928 5.47h29.02a4.146 4.146 0 0 0 3.927-5.47z" fill="url(#azC)"/>
  </g>

  <rect x="384" y="150" width="212" height="82" rx="9" fill="#FFD43B" stroke="#B8860B" stroke-width="2.5"/>
  <text x="490" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">RBAC</text>
  <text x="490" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A">Foundry User</text>
  <text x="490" y="215" text-anchor="middle" font-size="11" fill="#1A1A1A">(at resource scope)</text>

  <rect x="384" y="262" width="212" height="72" rx="9" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
  <text x="490" y="290" text-anchor="middle" font-size="12" fill="#311B92">Custom subdomain endpoint</text>
  <text x="490" y="309" text-anchor="middle" font-size="11.5" fill="#311B92">(region matters)</text>

  <path d="M490 232 L490 262" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Model deployments (nested INSIDE Foundry) ===== -->
  <rect x="628" y="118" width="386" height="288" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Claude (Anthropic) sunburst mark -->
  <g>
    <rect x="636" y="128" width="48" height="48" rx="11" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <g fill="#D97757">
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(0 660 152)"/>
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(30 660 152)"/>
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(60 660 152)"/>
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(90 660 152)"/>
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(120 660 152)"/>
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(150 660 152)"/>
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(180 660 152)"/>
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(210 660 152)"/>
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(240 660 152)"/>
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(270 660 152)"/>
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(300 660 152)"/>
      <rect x="658" y="133" width="4" height="11" rx="2" transform="rotate(330 660 152)"/>
    </g>
  </g>
  <text x="698" y="157" font-size="14" font-weight="700" fill="#15803D">Model deployments</text>

  <rect x="648" y="190" width="348" height="60" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="822" y="216" text-anchor="middle" font-size="13" font-weight="700" font-family="Consolas, monospace" fill="#1B5E20">claude-sonnet-4-6</text>
  <text x="822" y="235" text-anchor="middle" font-size="11.5" fill="#1B5E20">primary</text>

  <rect x="648" y="260" width="348" height="60" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="822" y="286" text-anchor="middle" font-size="13" font-weight="700" font-family="Consolas, monospace" fill="#1B5E20">claude-haiku-4-5</text>
  <text x="822" y="305" text-anchor="middle" font-size="11.5" fill="#1B5E20">fast</text>

  <rect x="648" y="330" width="348" height="60" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="822" y="356" text-anchor="middle" font-size="13" font-weight="700" font-family="Consolas, monospace" fill="#1B5E20">claude-opus-4-6</text>
  <text x="822" y="375" text-anchor="middle" font-size="11.5" fill="#1B5E20">extended thinking</text>

  <!-- endpoint -> model deployment arrows -->
  <path d="M596 298 C 622 280, 626 220, 648 220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M596 298 L 648 290" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M596 298 C 622 316, 626 360, 648 360" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Cross-container arrow ===== -->
  <path d="M282 346 C 330 344, 340 188, 384 188" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="333" y="256" text-anchor="middle" font-size="11" fill="#475569">Entra ID bearer</text>

  <!-- ===== Legend ===== -->
  <rect x="30" y="442" width="22" height="16" rx="3" fill="#FFD43B" stroke="#B8860B" stroke-width="2"/>
  <text x="60" y="455" font-size="12.5" fill="#475569">Yellow = where ~90% of customer failures occur (env-var inheritance, wrong tenant, missing RBAC).</text>
</svg>
